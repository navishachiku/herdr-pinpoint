id = "herdr-target-picker"
name = "Target Picker"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Pick a space, tab, or pane and type its herdr id into the agent you called from"
platforms = ["macos", "linux", "windows"]

# Keybindings can only invoke actions, so `open` is the entry point that
# launches the popup pane below.
[[actions]]
id = "open"
title = "Open target picker"
contexts = ["pane"]
command = ["bun", "src/open.ts"]

[[panes]]
id = "pick"
title = "Target Picker"
placement = "popup"
width = "80%"
height = "80%"
command = ["bun", "src/main.ts"]
